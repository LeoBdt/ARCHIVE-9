name: archive-9

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=640MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=30
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 1g
    networks: [db]

  bot:
    image: ${BOT_IMAGE}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID}
      KNOWN_AI_BOT_IDS: ${KNOWN_AI_BOT_IDS:-}
      LISTENED_CHANNEL_IDS: ${LISTENED_CHANNEL_IDS:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      OPENROUTER_PROVIDER_ORDER: ${OPENROUTER_PROVIDER_ORDER:-baidu,deepinfra,alibaba}
      BOT_TIMEZONE: ${BOT_TIMEZONE:-Europe/Paris}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    labels:
      - wud.watch=true
      - wud.watch.digest=true
      - wud.trigger.docker.autoupdate.enabled=true
    mem_limit: 384m
    networks: [db, egress]

  backup:
    image: postgres:18-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          pg_dump -Fc -f "/backups/archive9-$$(date +%F).dump" \
            && find /backups -name '*.dump' -mtime +$${BACKUP_KEEP_DAYS} -delete
          sleep 86400
        done
    volumes:
      - backups:/backups
    mem_limit: 64m
    networks: [db]

  wud:
    image: getwud/wud:9
    restart: unless-stopped
    environment:
      WUD_WATCHER_LOCAL_WATCHBYDEFAULT: "false"
      WUD_TRIGGER_DOCKER_AUTOUPDATE_AUTO: "true"
      WUD_TRIGGER_DOCKER_AUTOUPDATE_PRUNE: "true"
      WUD_TRIGGER_DOCKER_AUTOUPDATE_INCLUDEBYDEFAULT: "false"
      WUD_AUTH_ADMIN_USER: ${WUD_ADMIN_USER:-admin}
      WUD_AUTH_ADMIN_PASSWORD: ${WUD_ADMIN_PASSWORD}
      WUD_AUTH_SESSION_SECRET: ${WUD_SESSION_SECRET}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - wud:/store
    ports:
      - ${WUD_PORT:-3000}:3000
    mem_limit: 128m
    networks: [egress]

volumes:
  pgdata:
  backups:
  wud:

networks:
  db:
    internal: true
  egress:
