name: archive-9

services:
  postgres:
    # Built on the host the first time (pgvector added to postgres:18-alpine), then reused.
    image: archive-9-postgres:18
    build:
      context: .
      dockerfile: docker/postgres.Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=640MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=30
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 1g
    networks: [db]

  bot:
    image: ${BOT_IMAGE}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID}
      KNOWN_AI_BOT_IDS: ${KNOWN_AI_BOT_IDS:-}
      LISTENED_CHANNEL_IDS: ${LISTENED_CHANNEL_IDS:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      OPENROUTER_PROVIDER_ORDER: ${OPENROUTER_PROVIDER_ORDER:-baidu,deepinfra,alibaba}
      BOT_TIMEZONE: ${BOT_TIMEZONE:-Europe/Paris}
      # No value: passed only when set in .env, so the bot's defaults apply otherwise
      # (an empty string would override them)
      BOT_ALIASES:
      BOT_SOFT_ALIASES:
      AI_ROUTE_TRIAGE:
      AI_ROUTE_REPLY:
      AI_ROUTE_ANALYSIS:
      AI_ROUTE_REFLECTION:
      ANALYSIS_DAILY_BUDGET_USD:
      REPLY_DAILY_BUDGET_USD:
      AGENTS_CATEGORY_ID:
      WEB_DB_PASSWORD: ${WEB_DB_PASSWORD:-}
      MESSAGE_RETENTION_DAYS:
      SITE_URL: ${SITE_URL:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    mem_limit: 384m
    networks: [db, egress]

  web:
    image: ${WEB_IMAGE:-ghcr.io/leobdt/archive-9-web:latest}
    restart: unless-stopped
    depends_on:
      # The bot creates the site's database user at start-up.
      bot:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://archive9_web:${WEB_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SITE_URL: ${SITE_URL}
      SITE_OWNER_ID: ${SITE_OWNER_ID}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      REPLY_DAILY_BUDGET_USD:
      BOT_TIMEZONE: ${BOT_TIMEZONE:-Europe/Paris}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    # No published port: only the tunnel reaches it.
    mem_limit: 256m
    networks: [db, egress]

  tunnel:
    image: cloudflare/cloudflared:2026.11.1
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    depends_on: [web]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    mem_limit: 128m
    networks: [egress]

  backup:
    image: postgres:18-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          pg_dump -Fc -f "/backups/archive9-$$(date +%F).dump" \
            && find /backups -name '*.dump' -mtime +$${BACKUP_KEEP_DAYS} -delete
          sleep 86400
        done
    volumes:
      - backups:/backups
    mem_limit: 64m
    networks: [db]

volumes:
  pgdata:
  backups:

networks:
  db:
    internal: true
  egress:
